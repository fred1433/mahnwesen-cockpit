name: Pruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    name: Typen, Tests, Lauf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Mahnlauf
        run: npm run lauf

      - name: Die abgelegten Briefe muessen genau das sein, was der Lauf erzeugt
        run: git diff --exit-code -- briefe out
