name: Pruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    name: Typen, Tests, Lauf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Mahnlauf
        run: npm run lauf

      - name: Die abgelegten Dateien muessen genau das sein, was der Lauf erzeugt
        run: git diff --exit-code -- entwuerfe postausgang_test out

      - name: Der Dienst antwortet, so wie n8n ihn aufruft
        run: |
          node src/dienst.ts &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5789/gesundheit >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5789/gesundheit | grep -q '"status":"bereit"'
          curl -sf -X POST http://127.0.0.1:5789/lauf | grep -q '"beispieldaten":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5789/fehler-test)" = "503"

      - name: In den n8n-Exporten stehen keine Zugangsdaten und keine Pfade
        run: |
          ! grep -rniE '"credentials"|authorization|apikey|api_key|bearer|password|token|secret|/Users/|/home/' n8n/*.json

      - name: Keine Gebuehr, kein Zins, keine Rechtsbehauptung in den Entwuerfen
        run: |
          ! grep -rniE 'verzug|verzugszins|mahngebühr|mahngebuehr|mahnbescheid|rechtssicher|§' entwuerfe/ postausgang_test/
